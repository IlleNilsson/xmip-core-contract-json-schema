[package]
name = "xmip-core-contract-json-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-contract-json-schema"
description = "JSON content contract: well-formed always, conforming to a bound JSON Schema when a Location names one. A xmip-core-contract technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Contract trait and its value types live there.
contract = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# contract::ContractFactory (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }
stream = { workspace = true, optional = true }

# The one real parser. Well-formedness is a genuine parse, not a byte scan, and
# the schema is itself a JSON document read through the same parser.
serde_json = { version = "1", optional = true }
# A bare document read a piece at a time and discarded as it is read.
serde = { version = "1", optional = true }

# `pattern` and `format: regex`. Finite automata, linear in the input, so a
# pattern in a schema cannot stall a Receive Location.
regex = { version = "1", optional = true }

# `date`, `time` and `date-time` are RFC 3339's, read by the estate's one
# calendar.
codec = { workspace = true, optional = true }

[features]
# The code and its declaration: the contract guide,
# module/core/capability/contract/doc/adding-a-contract.md.
default = [
    "declaration", "dep:contract", "dep:stream", "dep:serde_json", "dep:serde", "dep:regex",
    "dep:codec",
]
# The declaration alone.
declaration = []

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The parent's Stream fixture, for the tests only (ADR-0044).
contract = { workspace = true, features = ["test-support"] }
# The timing program's figure, the fastest of five over its rounds, read
# once for the estate (`xcore::latency`); for the tests only.
xcore = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
